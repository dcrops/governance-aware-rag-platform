services:
  rag-api:
    build: .
    container_name: crc-rag-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  rag-ui:
    build: .
    container_name: crc-rag-ui
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://rag-api:8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - rag-api
    restart: unless-stopped